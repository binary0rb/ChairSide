<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChairSide Board - Doctor View</title>
  <link rel="stylesheet" href="/styles.css?v=20260707-doctor-operational-header">
</head>
<body data-view="doctor">
  <header class="app-header compact">
    <div>
      <div class="brand-lockup compact-brand">
        <img class="brand-logo" src="/assets/aos-logo.svg" alt="AOS logo">
        <div>
          <span class="brand-kicker">AOS ChairSide</span>
          <h1 id="doctorViewTitle">Doctor View</h1>
        </div>
      </div>
      <p>Read-only room status.</p>
    </div>
    <nav class="primary-nav" aria-label="Primary views">
      <a class="nav-pill" href="/master.html" data-nav="master">Master</a>
      <div class="nav-item" data-nav="doctor">
        <button type="button" class="nav-pill nav-pill-toggle" id="doctorViewToggle" aria-haspopup="true" aria-expanded="false" aria-controls="doctorViewMenu">
          <span id="doctorViewToggleLabel">Doctor View</span>
          <span class="nav-caret" aria-hidden="true"></span>
        </button>
        <div class="nav-menu" id="doctorViewMenu" role="menu" aria-label="Choose a doctor" hidden></div>
      </div>
      <a class="nav-pill" href="/reports.html" data-nav="reports">Reports</a>
      <a class="nav-pill" href="/workshop.html" data-nav="workshop">Workshop</a>
    </nav>
  </header>

  <main class="doctor-shell">
    <!-- Operational header: live room status (upper-left) stays above the reporting detail so
         expanding a report tab can never push current room status below the fold. Normal document
         flow - not a viewport-fixed overlay. The reporting snapshot (upper-right) is hidden until
         app.reports loads (silent if no admin token). -->
    <section class="doctor-operational-header">
      <section class="doctor-current-rooms-frame" aria-label="Current room status">
        <h2 class="doctor-current-rooms-title">Current Room Status</h2>
        <section class="doctor-list room-count-0" id="doctorRoomList"></section>
      </section>
      <section id="doctorCockpit" class="doctor-report-snapshot" hidden>
        <div id="doctorContextCard" class="doctor-context-card"></div>
      </section>
    </section>
    <!-- Reporting detail: full selected-doctor panel with tabs. Lives in its own region below the
         operational header and may grow downward freely. -->
    <section class="doctor-report-details">
      <section id="selectedDoctorPanel" class="selected-doctor-panel" hidden></section>
    </section>
  </main>

  <script src="/signalr-lite.js"></script>
  <script src="/board.js?v=20260707-doctor-operational-header"></script>
</body>
</html>
