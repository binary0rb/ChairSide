<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChairSide Board - Doctor View</title>
  <link rel="stylesheet" href="/styles.css?v=20260623-reporting-hygiene">

<body data-view="doctor">
  <header class="app-header compact">
    <div>
      <div class="brand-lockup compact-brand">

          <span class="brand-kicker">AOS ChairSide</span>
          <h1 id="doctorViewTitle">Doctor View</h1>
