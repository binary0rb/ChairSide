<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChairSide Board - Reports</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body data-view="reports">
  <header class="app-header compact">
    <div>
      <span class="brand-kicker">ChairSide Board</span>
      <h1>Reports</h1>
      <p>Operational room-flow metrics only. No patient data.</p>
    </div>
    <nav class="view-links" aria-label="Views">
      <a href="/master.html">Master</a>
      <a href="/doctor.html">Doctor</a>
      <a href="/reports.html">Reports</a>
      <a href="/room.html?roomId=1">Room 1</a>
    </nav>
  </header>

  <main class="reports-shell">
    <section class="report-summary" id="reportSummary" aria-label="Room flow summary"></section>
    <section class="report-table-section">
      <h2>Recent Completed Cycles</h2>
      <div class="report-table-wrap">
        <table class="report-table">
          <thead>
            <tr>
              <th>Room</th>
              <th>Doctor</th>
              <th>Procedure</th>
              <th>Seated</th>
              <th>Doctor Arrived</th>
              <th>Doctor Complete</th>
              <th>Available</th>
              <th>Seated-to-Doctor</th>
              <th>In Room</th>
              <th>Turnover</th>
              <th>Total</th>
              <th>Wait State</th>
              <th>Aging</th>
              <th>Stale</th>
            </tr>
          </thead>
          <tbody id="completedCyclesBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/signalr-lite.js"></script>
  <script src="/board.js"></script>
</body>
</html>
