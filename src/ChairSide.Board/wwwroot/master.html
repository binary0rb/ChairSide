<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChairSide Board</title>
  <link rel="stylesheet" href="/styles.css?v=20260622-procedure-chip-panels">
</head>
<body data-view="master">
  <header class="app-header compact">
    <div>
      <div class="brand-lockup compact-brand">
        <img class="brand-logo" src="/assets/aos-logo.svg" alt="AOS logo">
        <div>
          <span class="brand-kicker">AOS ChairSide</span>
          <h1>Master Board</h1>
        </div>
      </div>
      <p>Room status only. No patient data.</p>
    </div>
    <nav class="primary-nav" aria-label="Primary views">
      <a class="nav-pill" href="/master.html" data-nav="master">Master</a>
      <div class="nav-item" data-nav="doctor">
        <button type="button" class="nav-pill nav-pill-toggle" id="doctorViewToggle" aria-haspopup="true" aria-expanded="false" aria-controls="doctorViewMenu">
          <span id="doctorViewToggleLabel">Doctor View</span>
          <span class="nav-caret" aria-hidden="true"></span>
        </button>
        <div class="nav-menu" id="doctorViewMenu" role="menu" aria-label="Choose a doctor" hidden></div>
      </div>
      <a class="nav-pill" href="/reports.html" data-nav="reports">Reports</a>
    </nav>
  </header>

  <main class="master-shell">
    <section class="legend" aria-label="Doctor color legend">
      <div class="legend-group" id="doctorLegend"></div>
      <div class="legend-group procedure-key" id="procedureLegend"></div>
      <div class="state-key">
        <span><i class="state-dot empty"></i> Available</span>
        <span><i class="state-dot seated"></i> In Prep: patient preparing, not yet ready</span>
        <span><i class="state-dot ready-for-doctor"></i> Ready: doctor requested</span>
        <span id="agingLegendLabel"><i class="state-dot aging"></i> Aging: doctor requested too long</span>
        <span id="staleLegendLabel"><i class="state-dot stale"></i> Stale: doctor requested very long</span>
        <span><i class="state-dot doctor-in-room"></i> Doctor In Room</span>
        <span><i class="state-dot turnover"></i> Turnover</span>
      </div>
    </section>

    <section class="room-grid" id="roomGrid" aria-label="Room card grid"></section>
  </main>

  <script src="/signalr-lite.js"></script>
  <script src="/board.js?v=20260622-procedure-chip-panels"></script>
</body>
</html>
